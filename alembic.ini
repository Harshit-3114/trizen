[alembic]
# path to migration scripts
script_location = alembic

url = %(DATABASE_URL)s
# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
# defaults to the current working directory.
# prepend_sys_path = .

# timezone to use when resolving the date in revision files
# timezone = utc

# max length of characters to apply to the
# "caching" effect of version table operations
# version_table_encoding = utf-8

# version table schema to use for the database with
# version_table_schema feature.
# version_table_schema = 

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5s [%(asctime)s] %(name)s: %(message)s


